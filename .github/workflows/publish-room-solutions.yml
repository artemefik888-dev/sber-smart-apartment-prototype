name: Publish room solution PDFs

on:
  push:
    tags:
      - room-solutions-2026-09-24
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: room-solutions-2026-09-24
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install pypdf==6.10.0
      - run: python scripts/build_room_solutions.py --output-dir release-assets
      - name: Upload all six room PDFs to the public release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$RELEASE_TAG" release-assets/*.pdf --clobber
